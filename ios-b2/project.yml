name: LikeArt
options:
  bundleIdPrefix: com.likeart
  deploymentTarget:
    iOS: '16.0'
  developmentLanguage: en
  knownRegions: [en, zh-Hans, ru, Base]
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    DEVELOPMENT_TEAM: 2JZCL349AG
targets:
  LikeArt:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.likeart.app
        PRODUCT_NAME: LikeArt
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        ENABLE_PREVIEWS: NO
schemes:
  LikeArt:
    build:
      targets:
        LikeArt: all
    archive:
      config: Release
