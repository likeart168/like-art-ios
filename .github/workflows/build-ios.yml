name: Build iOS App (WKWebView)

on:
  push:
    branches: [ios-redirect]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build & Sign IPA
        run: |
          set -e
          echo "=== Extract cert ==="
          openssl pkcs12 -in ios_distribution.p12 -passin pass:likeart -clcerts -nokeys -out /tmp/cert.pem 2>&1
          openssl pkcs12 -in ios_distribution.p12 -passin pass:likeart -nocerts -nodes -out /tmp/key.pem 2>&1
          openssl pkcs12 -export -in /tmp/cert.pem -inkey /tmp/key.pem -out /tmp/new.p12 -passout pass:likeart 2>&1
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/new.p12 -k build.keychain -P "likeart" -T /usr/bin/codesign -A 2>&1
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain 2>&1 || true
          security find-identity -v -p codesigning build.keychain

          echo "=== Build ==="
          mkdir -p Payload/LikeArt.app/Base.lproj
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios15.0 -emit-executable -o Payload/LikeArt.app/LikeArt ios-simple/App/AppDelegate.swift ios-simple/App/ViewController.swift
          cp ios-simple/App/Info.plist Payload/LikeArt.app/
          cp ios-simple/App/LaunchScreen.storyboard Payload/LikeArt.app/Base.lproj/
          xcrun actool --compile Payload/LikeArt.app --app-icon AppIcon --output-partial-info-plist /tmp/partial.plist --minimum-deployment-target 15.0 --platform iphoneos ios-simple/App/Assets.xcassets 2>&1 || echo "actool skipped"
          cp likeart_appstore.mobileprovision Payload/LikeArt.app/embedded.mobileprovision

          python3 -c "
          f=open('/tmp/entitlements.plist','w')
          f.write('<?xml version="1.0" encoding="UTF-8"?>\n')
          f.write('<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n')
          f.write('<plist version="1.0"><dict>\n')
          f.write('<key>application-identifier</key><string>com.likeart.app</string>\n')
          f.write('<key>get-task-allow</key><false/>\n')
          f.write('</dict></plist>\n')
          f.close()
          "

          ID=$(security find-identity -v -p codesigning build.keychain 2>/dev/null | grep "iPhone Distribution" | head -1 | awk '{print $2}')
          codesign --force --sign "$ID" --entitlements /tmp/entitlements.plist --timestamp=none Payload/LikeArt.app
          codesign -dvv Payload/LikeArt.app 2>&1 | head -3
          zip -r LikeArt.ipa Payload/
          ls -la LikeArt.ipa
          echo "BUILD OK"

      - name: Upload to App Store Connect
        run: |
          echo "=== Decode API key ==="
          echo "" > /tmp/key.b64
          base64 -D -i /tmp/key.b64 -o /tmp/AuthKey.p8
          ls -la /tmp/AuthKey.p8

          echo "=== Upload ==="
          xcrun altool --upload-app -f LikeArt.ipa -t ios --apiKey 2W7A5K57L2 --apiIssuer 8ad4234e-2fc0-4943-8cde-e8bff3541efb --apiKeyFile /tmp/AuthKey.p8 2>&1
          echo "UPLOAD DONE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LikeArt-iOS-WKWebView
          path: LikeArt.ipa
          retention-days: 30
