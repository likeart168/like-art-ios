name: Build iOS App

on:
  push:
    branches: [ios-redirect]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build with swiftc
        run: |
          set -ex
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          
          cd ios-simple
          mkdir -p build/Payload/LikeArt.app
          
          # Compile Swift
          swiftc -sdk "$SDK" -target arm64-apple-ios15.0 \
            -emit-executable -o build/Payload/LikeArt.app/LikeArt \
            App/AppDelegate.swift
          
          echo "Binary built: $(file build/Payload/LikeArt.app/LikeArt)"
          
          # Copy Info.plist
          cp App/Info.plist build/Payload/LikeArt.app/
          
          # Package as IPA
          cd build
          zip -r ../LikeArt.ipa Payload/
          cd ..
          
          ls -la LikeArt.ipa
          echo "IPA_SIZE=$(stat -f%z LikeArt.ipa)" >> $GITHUB_ENV

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LikeArt-iOS-v${{ github.run_number }}
          path: ios-simple/LikeArt.ipa
          retention-days: 90
