name: Build iOS App (WKWebView)

on:
  push:
    branches: [ios-redirect]
    paths:
      - 'ios-simple/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build IPA with WKWebView
        run: |
          set -e
          APP_DIR="Payload/LikeArt.app"
          mkdir -p "${APP_DIR}"

          echo "=== 1. Compile Swift ==="
          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios15.0 \
            -emit-executable \
            -o "${APP_DIR}/LikeArt" \
            ios-simple/App/AppDelegate.swift \
            ios-simple/App/ViewController.swift
          file "${APP_DIR}/LikeArt"

          echo "=== 2. Info.plist ==="
          cp ios-simple/App/Info.plist "${APP_DIR}/Info.plist"

          echo "=== 3. LaunchScreen ==="
          mkdir -p "${APP_DIR}/Base.lproj"
          ibtool --compile "${APP_DIR}/Base.lproj/LaunchScreen.storyboardc" \
            ios-simple/App/LaunchScreen.storyboard 2>&1 || \
            cp ios-simple/App/LaunchScreen.storyboard "${APP_DIR}/Base.lproj/"

          echo "=== 4. Assets ==="
          xcrun actool --compile "${APP_DIR}" \
            --app-icon AppIcon \
            --output-partial-info-plist /tmp/partial.plist \
            --minimum-deployment-target 15.0 \
            --platform iphoneos \
            ios-simple/App/Assets.xcassets 2>&1 || echo "actool skipped"

          echo "=== 5. Verify bundle ==="
          find "${APP_DIR}" -type f | sort

          echo "=== 6. Import cert ==="
          [ -f ios_distribution.p12 ] && cp ios_distribution.p12 /tmp/dist.p12
          [ -f ios_distribution.p12.b64 ] && base64 -d ios_distribution.p12.b64 > /tmp/dist.p12
          [ ! -f /tmp/dist.p12 ] && echo "ERROR: No p12" && exit 1

          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/dist.p12 -k build.keychain -P "likeart" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          echo "Cert imported"

          echo "=== 7. Provisioning profile ==="
          [ -f likeart_appstore.mobileprovision ] && cp likeart_appstore.mobileprovision "${APP_DIR}/embedded.mobileprovision"
          [ -f likeart_appstore.mobileprovision.b64 ] && base64 -d likeart_appstore.mobileprovision.b64 > "${APP_DIR}/embedded.mobileprovision"
          [ ! -f "${APP_DIR}/embedded.mobileprovision" ] && echo "ERROR: No profile" && exit 1

          echo "=== 8. Entitlements ==="
          security cms -D -i "${APP_DIR}/embedded.mobileprovision" > /tmp/profile.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' /tmp/profile.plist > /tmp/entitlements.plist 2>/dev/null || \
            python3 -c "import plistlib; plistlib.dump({'application-identifier':'com.likeart.app','get-task-allow':False}, open('/tmp/entitlements.plist','wb'))"

          echo "=== 9. Codesign ==="
          codesign --force --sign "iPhone Distribution" \
            --entitlements /tmp/entitlements.plist \
            --timestamp=none \
            "${APP_DIR}" 2>&1
          codesign -dvv "${APP_DIR}" 2>&1 | head -5

          echo "=== 10. Package IPA ==="
          zip -r LikeArt.ipa Payload/
          ls -la LikeArt.ipa
          echo "SUCCESS: $(wc -c < LikeArt.ipa) bytes"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LikeArt-iOS-v${{ github.run_number }}
          path: LikeArt.ipa
          retention-days: 30
