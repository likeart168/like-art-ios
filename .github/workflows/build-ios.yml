name: Build iOS Redirect App

on:
  push:
    branches: [ios-redirect]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build IPA
        run: |
          set -ex
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          
          cd ios-simple
          mkdir -p Payload/LikeArt.app
          
          # Compile Swift → arm64 binary
          swiftc -sdk "$SDK" -target arm64-apple-ios15.0 \
            -emit-executable -o Payload/LikeArt.app/LikeArt \
            App/AppDelegate.swift
          
          file Payload/LikeArt.app/LikeArt
          
          # Copy Info.plist
          cp App/Info.plist Payload/LikeArt.app/
          
          # Ad-hoc codesign (no cert needed)
          codesign --force --sign - Payload/LikeArt.app/
          
          # Package IPA
          zip -r ../LikeArt.ipa Payload/
          cd ..
          ls -la LikeArt.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LikeArt-iOS-v${{ github.run_number }}
          path: ios-simple/LikeArt.ipa
