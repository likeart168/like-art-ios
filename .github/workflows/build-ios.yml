name: Build iOS Redirect App

on:
  push:
    branches: [ios-redirect]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build IPA
        run: |
          # Show environment
          xcrun --sdk iphoneos --show-sdk-path
          swift --version
          
          # Create app bundle
          mkdir -p Payload/LikeArt.app
          
          # Compile with xcrun swiftc
          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios15.0 \
            -emit-executable \
            -o Payload/LikeArt.app/LikeArt \
            ios-simple/App/AppDelegate.swift
          
          echo "Compile OK"
          file Payload/LikeArt.app/LikeArt
          
          # Use pre-built Info.plist directly
          cp ios-simple/App/Info.plist Payload/LikeArt.app/Info.plist
          
          # Ad-hoc sign
          codesign --force --sign - Payload/LikeArt.app/ 2>&1
          echo "Sign OK"
          
          # Package
          zip -r LikeArt.ipa Payload/
          ls -la LikeArt.ipa
          echo "DONE"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LikeArt-iOS-v${{ github.run_number }}
          path: LikeArt.ipa
