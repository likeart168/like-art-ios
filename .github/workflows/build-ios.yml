name: Build iOS App (WKWebView)

on:
  push:
    branches: [ios-redirect]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build & Sign IPA
        run: |
          echo "=== Cert import ==="
          [ -f ios_distribution.p12 ] && cp ios_distribution.p12 /tmp/dist.p12
          [ -f ios_distribution.p12.b64 ] && base64 -d ios_distribution.p12.b64 > /tmp/dist.p12
          security import /tmp/dist.p12 -f pkcs12 -P "likeart" -A -T /usr/bin/codesign 2>&1 || echo "import failed, continuing"
          security find-identity -v -p codesigning 2>&1 || echo "no identities"

          echo "=== Build ==="
          mkdir -p Payload/LikeArt.app/Base.lproj
          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios15.0 \
            -emit-executable \
            -o Payload/LikeArt.app/LikeArt \
            ios-simple/App/AppDelegate.swift \
            ios-simple/App/ViewController.swift
          cp ios-simple/App/Info.plist Payload/LikeArt.app/
          cp ios-simple/App/LaunchScreen.storyboard Payload/LikeArt.app/Base.lproj/
          xcrun actool --compile Payload/LikeArt.app \
            --app-icon AppIcon --output-partial-info-plist /tmp/partial.plist \
            --minimum-deployment-target 15.0 --platform iphoneos \
            ios-simple/App/Assets.xcassets 2>&1 || echo "actool skipped"

          echo "=== Profile ==="
          [ -f likeart_appstore.mobileprovision ] && cp likeart_appstore.mobileprovision Payload/LikeArt.app/embedded.mobileprovision
          [ -f likeart_appstore.mobileprovision.b64 ] && base64 -d likeart_appstore.mobileprovision.b64 > Payload/LikeArt.app/embedded.mobileprovision

          echo "=== Entitlements ==="
          python3 -c "
          f=open('/tmp/entitlements.plist','w')
          f.write('<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n')
          f.write('<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">\n')
          f.write('<plist version=\"1.0\"><dict>\n')
          f.write('<key>application-identifier</key><string>com.likeart.app</string>\n')
          f.write('<key>get-task-allow</key><false/>\n')
          f.write('</dict></plist>\n')
          f.close()
          "

          echo "=== Sign ==="
          ID=$(security find-identity -v -p codesigning 2>/dev/null | grep "iPhone Distribution" | head -1 | awk '{print $2}')
          if [ -n "$ID" ]; then
            codesign --force --sign "$ID" --entitlements /tmp/entitlements.plist --timestamp=none Payload/LikeArt.app 2>&1 && echo "DISTRIBUTION SIGNED" || echo "SIGN FAILED"
          else
            echo "No dist cert, ad-hoc"
            codesign --force --sign - Payload/LikeArt.app 2>&1
          fi
          codesign -dvv Payload/LikeArt.app 2>&1 | head -2

          echo "=== Package ==="
          zip -r LikeArt.ipa Payload/
          ls -la LikeArt.ipa
          echo "DONE: $(wc -c < LikeArt.ipa)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LikeArt-iOS-v${{ github.run_number }}
          path: LikeArt.ipa
          retention-days: 30
