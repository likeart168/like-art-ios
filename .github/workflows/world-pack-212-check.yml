name: Verified world pack compile check
on:
  push:
    branches: [fix/world-entry-pack-212]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: bash ios-b2/ci/select_xcode.sh
      - run: command -v xcodegen >/dev/null || brew install xcodegen
      - run: python3 ios-b2/ci/fetch_world_pack.py
      - run: python3 ios-b2/ci/verify_source.py
      - run: xcodegen generate --spec ios-b2/project.yml
      - name: Compile native world fix without signing or publishing
        run: |
          set -o pipefail
          xcodebuild -project ios-b2/LikeArt.xcodeproj -scheme LikeArt -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build-b2/Simulator build CODE_SIGNING_ALLOWED=NO | tee world-212-compile.log
      - name: Exercise the real bundled pack in WKWebView
        run: |
          set -o pipefail
          python3 -u ios-b2/ci/capture_world.py 2>&1 | tee world-212-runtime.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-212-compile
          path: |
            world-212-compile.log
            build-b2/evidence/world-entry-20/
            world-212-runtime.log
      - name: Preserve public guest evidence on the isolated repair branch
        if: always()
        run: |
          if [ -d build-b2/evidence/world-entry-20 ]; then
            evidence_dir="docs/world-212-runtime/run-${{ github.run_id }}"
            mkdir -p "$evidence_dir"
            cp build-b2/evidence/world-entry-20/* "$evidence_dir/"
            cp world-212-runtime.log "$evidence_dir/"
            git config user.name github-actions
            git config user.email github-actions@users.noreply.github.com
            git add docs/world-212-runtime
            git diff --cached --quiet || git commit -m "[skip ci] Record public guest WKWebView world evidence"
            git push origin HEAD:fix/world-entry-pack-212
          fi
