name: B2 Native iOS — Xcode 26
on:
  push:
    branches: [b2-native-shell]
    paths: ['ios-b2/**', '.github/workflows/build-b2.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: b2-native-ios
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Detect and select Xcode 26
        run: bash ios-b2/ci/select_xcode.sh
      - name: Install build tools
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          python3 -m venv build-b2/venv
          build-b2/venv/bin/pip install 'PyJWT[crypto]==2.10.1' 'requests==2.32.5'
      - name: Verify source and generate project
        run: |
          set -euo pipefail
          python3 ios-b2/ci/verify_source.py | tee build-b2/evidence/source-assertions.txt
          xcodegen generate --spec ios-b2/project.yml
      - name: Compile asset catalog
        run: |
          set -euo pipefail
          mkdir -p build-b2/assets
          xcrun actool ios-b2/Resources/Assets.xcassets --compile build-b2/assets --platform iphoneos --minimum-deployment-target 16.0 --target-device iphone --target-device ipad --app-icon AppIcon --output-partial-info-plist build-b2/asset-info.plist 2>&1 | tee build-b2/evidence/actool.txt
          test -s build-b2/assets/Assets.car
      - name: Build without signing
        run: |
          set -euo pipefail
          xcodebuild -project ios-b2/LikeArt.xcodeproj -scheme LikeArt -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-b2/DerivedData build CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$BUILD_NUMBER" 2>&1 | tee build-b2/evidence/unsigned-build.txt
      - name: Import distribution certificate and profile
        env:
          P12_CERTIFICATE: ${{ secrets.P12_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          python3 ios-b2/ci/signing.py
          bash ios-b2/ci/import_certificate.sh
      - name: Archive and codesign
        run: |
          set -euo pipefail
          xcodebuild -project ios-b2/LikeArt.xcodeproj -scheme LikeArt -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build-b2/LikeArt.xcarchive archive CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' DEVELOPMENT_TEAM=2JZCL349AG PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" CODE_SIGN_ENTITLEMENTS="$GITHUB_WORKSPACE/build-b2/LikeArt.entitlements" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" 2>&1 | tee build-b2/evidence/archive.txt
      - name: Export App Store IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive -archivePath build-b2/LikeArt.xcarchive -exportPath build-b2/export -exportOptionsPlist build-b2/ExportOptions.plist 2>&1 | tee build-b2/evidence/export.txt
          bash ios-b2/ci/verify_ipa.sh
      - name: Preserve IPA artifact
        if: ${{ always() && hashFiles('build-b2/export/*.ipa') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: LikeArt-B2-${{ env.BUILD_NUMBER }}
          path: build-b2/export/*.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Upload with ASC API key and verify VALID
        id: asc
        continue-on-error: true
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          AUTHKEY_BASE64: ${{ secrets.AUTHKEY_BASE64 }}
        run: |
          set -euo pipefail
          build-b2/venv/bin/python ios-b2/ci/asc.py
      - name: Build evidence summary
        if: always()
        env:
          ASC_OUTCOME: ${{ steps.asc.outcome }}
          BUILD_STATUS: ${{ job.status }}
        run: |
          set +e
          mkdir -p build-b2/evidence
          bash ios-b2/ci/summary.sh
          xcodebuild -version
          df -h .
          exit 0
      - name: Preserve evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LikeArt-B2-evidence-${{ github.run_id }}
          path: build-b2/evidence/
          retention-days: 30
      - name: Publish stdout evidence for public verification
        if: always()
        run: bash ios-b2/ci/publish_evidence.sh
      - name: Clean temporary signing resources
        if: always()
        run: |
          set +e
          rm -f build-b2/*.p12 build-b2/*.pem build-b2/*.mobileprovision
          security delete-keychain "$HOME/Library/Keychains/build.keychain-db"
          exit 0
